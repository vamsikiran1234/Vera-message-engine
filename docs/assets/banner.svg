<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="40%" stop-color="#111827"/>
      <stop offset="80%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="blob1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FF3366" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF3366" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="100" r="180" fill="url(#blob1)"/>
  <circle cx="980" cy="240" r="220" fill="url(#blob2)"/>

  <!-- Decorative Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- Top Pill Badge: magicpin AI Challenge -->
  <g transform="translate(60, 48)">
    <rect width="250" height="32" rx="16" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.5"/>
    <circle cx="18" cy="16" r="5" fill="#a855f7"/>
    <text x="32" y="21" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1">MAGICPIN AI CHALLENGE</text>
  </g>

  <!-- Main Header / Logo -->
  <g transform="translate(60, 140)">
    <!-- Crystal Icon -->
    <g transform="translate(0, -32) scale(0.9)">
      <polygon points="30,0 60,20 60,60 30,80 0,60 0,20" fill="url(#accentGrad)" opacity="0.9"/>
      <polygon points="30,10 50,25 50,55 30,70 10,55 10,25" fill="#0f172a" opacity="0.75"/>
      <polyline points="30,0 30,80" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
      <polyline points="0,20 60,60" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
      <polyline points="0,60 60,20" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    </g>

    <!-- Main Title -->
    <text x="75" y="15" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">VERA</text>
    <text x="245" y="15" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="400">|</text>
    <text x="270" y="15" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Autonomous Merchant Growth Engine</text>
  </g>

  <!-- Subtitle -->
  <text x="60" y="200" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">
    Deterministic, context-grounded proactive intelligence for hyperlocal commerce &amp; customer recall
  </text>

  <!-- Feature Badges Row -->
  <g transform="translate(60, 245)">
    <!-- Badge 1: Score -->
    <g transform="translate(0, 0)">
      <rect width="210" height="42" rx="8" fill="#14532d" fill-opacity="0.5" stroke="#22c55e" stroke-width="1.5"/>
      <text x="18" y="26" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">★ Judge Score: 41/50 (82%)</text>
    </g>

    <!-- Badge 2: Unit Tests -->
    <g transform="translate(225, 0)">
      <rect width="185" height="42" rx="8" fill="#1e3a8a" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="18" y="26" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">✓ 161/161 Tests Passing</text>
    </g>

    <!-- Badge 3: Grounded -->
    <g transform="translate(425, 0)">
      <rect width="220" height="42" rx="8" fill="#581c87" fill-opacity="0.5" stroke="#a855f7" stroke-width="1.5"/>
      <text x="18" y="26" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">🛡️ Zero Hallucinations</text>
    </g>

    <!-- Badge 4: Deployment -->
    <g transform="translate(660, 0)">
      <rect width="180" height="42" rx="8" fill="#042f2e" fill-opacity="0.5" stroke="#14b8a6" stroke-width="1.5"/>
      <text x="18" y="26" fill="#5eead4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">⚡ Live on Render</text>
    </g>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="354" width="1200" height="6" fill="url(#accentGrad)" rx="3"/>
</svg>
